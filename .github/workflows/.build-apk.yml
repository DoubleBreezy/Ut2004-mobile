name: Build Android APK (Godot 4.3)
on: [push, workflow_dispatch]
jobs:
  build-android:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Download 3D Soldier & 1K PBR Texture Packs
        run: |
          mkdir -p assets/models assets/textures assets/audio /tmp/d
          (apt-get update -qq && apt-get install -y -qq python3 unzip espeak-ng) || true

          python3 - << 'PYEOF'
          import os, urllib.request, zipfile

          os.makedirs("assets/models", exist_ok=True)
          os.makedirs("assets/textures", exist_ok=True)
          os.makedirs("/tmp/d", exist_ok=True)

          def fetch(urls, dst):
              for u in urls:
                  try:
                      req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=30) as r, open(dst, "wb") as f:
                          f.write(r.read())
                      if os.path.exists(dst) and os.path.getsize(dst) > 2000:
                          print("OK:", dst, os.path.getsize(dst), "bytes")
                          return True
                  except Exception as e:
                      print("Skip:", u, e)
              return False

          fetch([
              "https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/examples/models/gltf/Soldier.glb",
              "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Soldier.glb"
          ], "assets/models/soldier.glb")

          packs = {
              "floor": ["DiamondPlate008C", "MetalPlates006"],
              "wall":  ["Metal049A", "Metal032"],
              "moss":  ["Moss002", "Ground037", "Ground054", "Grass001"],
              "bark":  ["Bark007", "Bark001", "Bark006", "Bark012"],
              "rock":  ["Rock030", "Rock020", "Rock028", "Rock035"],
              "bio":   ["MetalPlates006", "Metal032", "Metal038"]
          }
          maps = [
              ("Color", "color"),
              ("NormalGL", "normal"),
              ("Roughness", "roughness"),
              ("Metalness", "metalness")
          ]

          for prefix, candidates in packs.items():
              for aid in candidates:
                  zpath = f"/tmp/d/{aid}.zip"
                  edir = f"/tmp/d/{aid}"
                  if fetch([f"https://ambientcg.com/get?file={aid}_1K-JPG.zip"], zpath):
                      try:
                          with zipfile.ZipFile(zpath, "r") as zf:
                              zf.extractall(edir)
                          got_color = False
                          for rd, _, files in os.walk(edir):
                              for fn in files:
                                  if not fn.lower().endswith(".jpg"):
                                      continue
                                  for tag, out_tag in maps:
                                      if f"_{tag}." in fn:
                                          src = os.path.join(rd, fn)
                                          dst = f"assets/textures/{prefix}_{out_tag}.jpg"
                                          with open(src, "rb") as sf, open(dst, "wb") as df:
                                              df.write(sf.read())
                                          if out_tag == "color":
                                              got_color = True
                          if got_color:
                              print("Loaded PBR pack:", prefix, "<-", aid)
                              break
                      except Exception as e:
                          print("Unzip err:", aid, e)
          PYEOF
          ls -lh assets/models assets/textures

      - name: Generate Filtered DSP Weapon SFX, Ambience & Announcer
        run: |
          cat << 'EOF' > /tmp/gen_audio.py
          import math, os, random, shutil, struct, subprocess, wave

          OUT = "assets/audio"
          os.makedirs(OUT, exist_ok=True)
          SR = 22050
          rng = random.Random(20042026)

          def save_wav(path, buf, gain_db=0.0):
              pk = max(1e-5, max(abs(x) for x in buf))
              sc = (0.92 * (10.0 ** (gain_db / 20.0))) / pk
              raw = bytearray(len(buf) * 2)
              for i, x in enumerate(buf):
                  v = max(-32767, min(32767, int(math.tanh(x * sc * 1.15) * 31500)))
                  struct.pack_into("<h", raw, i * 2, v)
              with wave.open(path, "wb") as wf:
                  wf.setnchannels(1)
                  wf.setsampwidth(2)
                  wf.setframerate(SR)
                  wf.writeframes(raw)

          def biquad(buf, ftype, freq, q=0.707):
              w0 = 2.0 * math.pi * max(25.0, min(SR * 0.45, freq)) / SR
              cw, sw = math.cos(w0), math.sin(w0)
              alpha = sw / (2.0 * q)
              if ftype == "lp":
                  b0, b1, b2 = (1 - cw) / 2, 1 - cw, (1 - cw) / 2
              elif ftype == "hp":
                  b0, b1, b2 = (1 + cw) / 2, -(1 + cw), (1 + cw) / 2
              else:
                  b0, b1, b2 = alpha, 0.0, -alpha
              a0, a1, a2 = 1 + alpha, -2 * cw, 1 - alpha
              b0 /= a0; b1 /= a0; b2 /= a0; a1 /= a0; a2 /= a0
              out = [0.0] * len(buf)
              x1 = x2 = y1 = y2 = 0.0
              for i, x0 in enumerate(buf):
                  y0 = b0 * x0 + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2
                  out[i] = y0
                  x2, x1, y2, y1 = x1, x0, y1, y0
              return out

          def add_reverb(buf, taps_ms, decay=0.35):
              extra = int(SR * (max(taps_ms) / 1000.0 + 0.05))
              out = list(buf) + [0.0] * extra
              for idx, ms in enumerate(taps_ms):
                  d = int(SR * ms / 1000.0)
                  g = decay * (0.72 ** idx)
                  for i in range(len(buf)):
                      out[i + d] += buf[i] * g
              return out

          # 1. ROCKET LAUNCHER: Mechanical breech spin-up -> heavy ignition blast -> whoosh
          n_rkt = int(0.62 * SR)
          mech = [0.0] * n_rkt
          blast = [0.0] * n_rkt
          ph = 0.0
          for i in range(n_rkt):
              t = i / float(SR)
              if t < 0.12:
                  u = t / 0.12
                  ph += 2.0 * math.pi * (280.0 + 950.0 * u * u) / SR
                  click = 1.0 if abs(t - 0.03) < 0.004 or abs(t - 0.09) < 0.004 else 0.0
                  mech[i] = (math.sin(ph) * 0.45 * u + rng.uniform(-1, 1) * click * 1.2)
              else:
                  u = (t - 0.12) / 0.50
                  ph += 2.0 * math.pi * (125.0 * ((1.0 - u) ** 1.6) + 34.0) / SR
                  env = (1.0 - u) ** 1.5
                  blast[i] = (rng.uniform(-1, 1) * 0.95 + math.sin(ph) * 0.85) * env
          mech_f = biquad(mech, "bp", 1600.0, 2.2)
          blast_lo = biquad(blast, "lp", 380.0, 0.9)
          blast_hi = biquad(blast, "bp", 1100.0, 0.8)
          rkt = [mech_f[i] * 0.85 + blast_lo[i] * 1.4 + blast_hi[i] * 0.55 for i in range(n_rkt)]
          save_wav(f"{OUT}/sfx_rocket.wav", add_reverb(rkt, [65, 145, 240], 0.28))

          # 2. ROCKET IN-FLIGHT ROAR (seamless 0.6s loop for AudioStreamPlayer3D)
          n_fly = int(0.60 * SR)
          raw_fly = [rng.uniform(-1, 1) for _ in range(n_fly)]
          fly_lo = biquad(raw_fly, "lp", 420.0, 1.1)
          fly_mid = biquad(raw_fly, "bp", 920.0, 1.6)
          fly = [fly_lo[i] * 1.1 + fly_mid[i] * 0.45 for i in range(n_fly)]
          save_wav(f"{OUT}/sfx_rocket_fly.wav", fly, -2.0)

          # 3. MASSIVE CANYON EXPLOSION (Crack + Sub Shockwave + Debris + Echo)
          n_boom = int(0.95 * SR)
          crack = [0.0] * n_boom
          rumble = [0.0] * n_boom
          ph = 0.0
          for i in range(n_boom):
              u = i / float(n_boom)
              ph += 2.0 * math.pi * (95.0 * ((1.0 - u) ** 2.2) + 24.0) / SR
              if u < 0.09:
                  crack[i] = rng.uniform(-1, 1) * ((1.0 - u / 0.09) ** 1.6)
              rumble[i] = (rng.uniform(-1, 1) * 0.85 + math.sin(ph) * 1.15) * ((1.0 - u) ** 1.45)
          rumble_lo = biquad(rumble, "lp", 260.0, 0.85)
          crack_hi = biquad(crack, "hp", 600.0, 0.7)
          boom = [rumble_lo[i] * 1.6 + crack_hi[i] * 0.95 for i in range(n_boom)]
          save_wav(f"{OUT}/sfx_boom.wav", add_reverb(boom, [95, 210, 340, 490], 0.36))

          # 4. FLAK CANNON (Pneumatic bolt + punchy shrapnel scatter)
          n_flk = int(0.45 * SR)
          flk_raw = [0.0] * n_flk
          ph = 0.0
          for i in range(n_flk):
              u = i / float(n_flk)
              ph += 2.0 * math.pi * (210.0 * ((1.0 - u) ** 2.0) + 46.0) / SR
              flk_raw[i] = (rng.uniform(-1, 1) * 0.95 + math.sin(ph) * 0.9) * ((1.0 - u) ** 1.9)
          flk_lo = biquad(flk_raw, "lp", 340.0, 0.9)
          flk_hi = biquad(flk_raw, "bp", 2400.0, 1.2)
          flk = [flk_lo[i] * 1.4 + flk_hi[i] * 0.8 for i in range(n_flk)]
          save_wav(f"{OUT}/sfx_flak.wav", add_reverb(flk, [55, 130], 0.25))

          # 5. SHOCK RIFLE (Crisp plasma snap + resonant low thump)
          n_shk = int(0.36 * SR)
          shk_hi = [0.0] * n_shk
          shk_lo = [0.0] * n_shk
          p1 = p2 = 0.0
          for i in range(n_shk):
              u = i / float(n_shk)
              p1 += 2.0 * math.pi * (1650.0 * ((1.0 - u) ** 2.4) + 220.0) / SR
              p2 += 2.0 * math.pi * (150.0 * ((1.0 - u) ** 1.5) + 48.0) / SR
              shk_hi[i] = (math.sin(p1) * 0.7 + rng.uniform(-1, 1) * 0.45) * ((1.0 - u) ** 2.0)
              shk_lo[i] = math.sin(p2) * ((1.0 - u) ** 1.7)
          shk = [biquad(shk_hi, "bp", 1200.0, 1.4)[i] * 0.95 + shk_lo[i] * 1.2 for i in range(n_shk)]
          save_wav(f"{OUT}/sfx_shock.wav", add_reverb(shk, [70, 160], 0.30))

          # 6. SHOCK COMBO (Vacuum suck -> massive plasma implosion)
          n_cmb = int(1.05 * SR)
          cmb = [0.0] * n_cmb
          ph = sub = 0.0
          for i in range(n_cmb):
              t = i / float(SR)
              if t < 0.10:
                  u = t / 0.10
                  ph += 2.0 * math.pi * (240.0 + 1100.0 * u * u) / SR
                  cmb[i] = math.sin(ph) * u * 0.65
              else:
                  u = (t - 0.10) / 0.95
                  ph += 2.0 * math.pi * (680.0 * ((1.0 - u) ** 2.2) + 45.0) / SR
                  sub += 2.0 * math.pi * (105.0 * ((1.0 - u) ** 1.6) + 26.0) / SR
                  cmb[i] = (math.sin(ph) * 0.55 + math.sin(sub) * 1.25 + rng.uniform(-1, 1) * 0.75) * ((1.0 - u) ** 1.35)
          cmb_f = [biquad(cmb, "lp", 320.0, 0.9)[i] * 1.5 + biquad(cmb, "bp", 1100.0, 1.5)[i] * 0.65 for i in range(n_cmb)]
          save_wav(f"{OUT}/sfx_combo.wav", add_reverb(cmb_f, [110, 230, 380], 0.38))

          # 7. LINK GUN (Tight energetic pulse)
          n_lnk = int(0.14 * SR)
          lnk = [0.0] * n_lnk
          ph = 0.0
          for i in range(n_lnk):
              u = i / float(n_lnk)
              ph += 2.0 * math.pi * (680.0 * ((1.0 - u) ** 1.3) + 190.0) / SR
              lnk[i] = (math.sin(ph) * 0.7 + rng.uniform(-1, 1) * 0.25) * ((1.0 - u) ** 1.8)
          save_wav(f"{OUT}/sfx_link.wav", biquad(lnk, "lp", 1800.0, 1.1))

          # 8. FOOTSTEPS: Forest moss crunch & Deck17 steel boot clank
          n_st = int(0.11 * SR)
          st_raw = [rng.uniform(-1, 1) * ((1.0 - i / float(n_st)) ** 2.4) for i in range(n_st)]
          st_thud = [math.sin(2.0 * math.pi * 88.0 * i / SR) * ((1.0 - i / float(n_st)) ** 2.6) for i in range(n_st)]
          st_for = [biquad(st_raw, "bp", 720.0, 1.1)[i] * 0.8 + st_thud[i] * 0.9 for i in range(n_st)]
          st_met = [biquad(st_raw, "bp", 2100.0, 2.8)[i] * 0.75 + st_thud[i] * 1.0 for i in range(n_st)]
          save_wav(f"{OUT}/sfx_step_forest.wav", st_for)
          save_wav(f"{OUT}/sfx_step_metal.wav", st_met)

          # 9. LIQUID LIFT VAT WHOOSH (Lush swirling aqua harmonic lift)
          n_vat = int(0.55 * SR)
          vat_nz = [rng.uniform(-1, 1) * math.sin(math.pi * i / float(n_vat)) for i in range(n_vat)]
          vat_tone = [0.0] * n_vat
          p1 = p2 = 0.0
          for i in range(n_vat):
              u = i / float(n_vat)
              p1 += 2.0 * math.pi * (180.0 + 520.0 * u * u) / SR
              p2 += 2.0 * math.pi * (270.0 + 780.0 * u * u) / SR
              vat_tone[i] = (math.sin(p1) * 0.5 + math.sin(p2) * 0.35) * math.sin(math.pi * u)
          vat = [biquad(vat_nz, "bp", 880.0, 1.4)[i] * 0.85 + vat_tone[i] * 0.9 for i in range(n_vat)]
          save_wav(f"{OUT}/sfx_vat_lift.wav", add_reverb(vat, [85, 190], 0.32))

          # 10. AMBIENT SOUNDTRACKS (Deep Atmospheric Forest vs Dark Industrial Bass — NO 8-bit chiptune!)
          # Tokara Forest: 8-second seamless lush alien jungle drone + subtle warm bass pulse
          n_tf = int(8.0 * SR)
          tf = [0.0] * n_tf
          for i in range(n_tf):
              t = i / float(SR)
              lfo = 0.65 + 0.35 * math.sin(2.0 * math.pi * 0.25 * t)
              pulse = 0.55 + 0.45 * math.sin(2.0 * math.pi * 1.0 * t)
              drone = (
                  math.sin(2.0 * math.pi * 55.0 * t) * 0.45 * pulse +
                  math.sin(2.0 * math.pi * 82.41 * t) * 0.28 * lfo +
                  math.sin(2.0 * math.pi * 130.81 * t + math.sin(t * 0.5)) * 0.16 * lfo +
                  math.sin(2.0 * math.pi * 246.94 * t) * 0.06 * (0.5 + 0.5 * math.sin(2.0 * math.pi * 0.375 * t))
              )
              tf[i] = drone + rng.uniform(-1, 1) * 0.05
          save_wav(f"{OUT}/bgm_tokara.wav", biquad(tf, "lp", 680.0, 0.7), -3.0)

          # Deck17: 4-second filtered deep dark-techno sub-bass + punchy kick
          step = 60.0 / 128.0 / 4.0
          n_d17 = int(32 * step * SR)
          d17 = [0.0] * n_d17
          bnotes = [55.0, 55.0, 65.41, 55.0, 49.0, 49.0, 61.74, 73.42]
          for s in range(32):
              t0, slen = int(s * step * SR), int(step * SR)
              if s % 4 == 0:
                  ph = 0.0
                  for i in range(min(int(0.18 * SR), n_d17 - t0)):
                      u = i / (0.18 * SR)
                      ph += 2.0 * math.pi * (120.0 * ((1.0 - u) ** 2.6) + 38.0) / SR
                      d17[t0 + i] += math.sin(ph) * ((1.0 - u) ** 1.4) * 0.85
              bf = bnotes[(s // 4) % 8]
              for i in range(min(slen, n_d17 - t0)):
                  u, t = i / float(slen), (t0 + i) / float(SR)
                  d17[t0 + i] += math.sin(2.0 * math.pi * bf * t) * (1.0 - u * 0.45) * 0.55
          save_wav(f"{OUT}/bgm_deck17.wav", biquad(d17, "lp", 420.0, 0.9), -2.0)

          # 11. DEEP BOOMING ARENA ANNOUNCER
          if shutil.which("espeak-ng"):
              lines = {
                  "ann_play": "Play!",
                  "ann_firstblood": "First Blood!",
                  "ann_double": "Double Kill!",
                  "ann_multi": "Multi Kill!",
                  "ann_monster": "Monster Kill!",
                  "ann_spree": "Killing Spree!",
                  "ann_unstoppable": "Unstoppable!",
                  "ann_combo": "Shock Combo!",
                  "ann_udamage": "Double Damage!",
                  "ann_victory": "You have won the match!"
              }
              for k, txt in lines.items():
                  rp = f"/tmp/{k}.wav"
                  subprocess.run(["espeak-ng", "-v", "en-us+m3", "-p", "18", "-s", "124", "-w", rp, txt], check=False)
                  if os.path.exists(rp):
                      with wave.open(rp, "rb") as rf:
                          rsr, raw = rf.getframerate(), rf.readframes(rf.getnframes())
                      smp = list(struct.unpack(f"<{len(raw)//2}h", raw))
                      nl = int(len(smp) / 0.76)
                      out = [0.0] * (nl + int(rsr * 0.45))
                      for i in range(nl):
                          src = i * 0.76
                          i0 = int(src)
                          fr = src - i0
                          s0 = smp[i0] if i0 < len(smp) else 0
                          s1 = smp[i0 + 1] if i0 + 1 < len(smp) else s0
                          out[i] = (s0 * (1.0 - fr) + s1 * fr) / 32768.0
                      d1, d2 = int(rsr * 0.095), int(rsr * 0.21)
                      for i in range(d1, len(out)):
                          out[i] += out[i - d1] * 0.34 + (out[i - d2] * 0.18 if i >= d2 else 0.0)
                      pk = max(1e-5, max(abs(x) for x in out))
                      ob = bytearray(len(out) * 2)
                      for i, x in enumerate(out):
                          struct.pack_into("<h", ob, i * 2, max(-32767, min(32767, int(math.tanh(x / pk * 1.2) * 31000))))
                      with wave.open(f"{OUT}/{k}.wav", "wb") as wf:
                          wf.setnchannels(1)
                          wf.setsampwidth(2)
                          wf.setframerate(rsr)
                          wf.writeframes(ob)
          EOF
          python3 /tmp/gen_audio.py
          ls -lh assets/audio

      - name: Setup Keystore & Export APK
        run: |
          mkdir -p ~/.local/share/godot ~/.config/godot build/android
          cp -rn /root/.local/share/godot/export_templates ~/.local/share/godot/ 2>/dev/null || true
          cp -rn /root/.config/godot/* ~/.config/godot/ 2>/dev/null || true
          [ -f /root/debug.keystore ] || keytool -genkeypair -keystore /root/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 9999 -dname "CN=Android Debug,O=Android,C=US"
          S="$HOME/.config/godot/editor_settings-4.3.tres"
          [ -f "$S" ] || godot --headless --editor --quit || true
          sed -i '/export\/android\/debug_keystore/d;/export\/android\/android_sdk_path/d' "$S" 2>/dev/null || true
          printf '\nexport/android/android_sdk_path = "/usr/lib/android-sdk"\nexport/android/debug_keystore = "/root/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' >> "$S"
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" build/android/ut2004-mobile.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ut2004-mobile-apk
          path: build/android/ut2004-mobile.apk
