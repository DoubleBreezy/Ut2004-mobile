name: Build Android APK (Godot 4.3)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot templates & Android SDK settings
        run: |
          mkdir -p ~/.local/share/godot ~/.config/godot build/android
          if [ -d /root/.local/share/godot/export_templates ]; then
            cp -rn /root/.local/share/godot/export_templates ~/.local/share/godot/
          fi
          if [ -d /root/.config/godot ]; then
            cp -rn /root/.config/godot/* ~/.config/godot/ || true
          fi
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
              -keystore /root/debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          fi
          SETTINGS_FILE="$HOME/.config/godot/editor_settings-4.3.tres"
          if [ ! -f "$SETTINGS_FILE" ]; then
            godot --headless --editor --quit || true
          fi
          if [ -f "$SETTINGS_FILE" ]; then
            grep -q 'export/android/android_sdk_path' "$SETTINGS_FILE" || echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> "$SETTINGS_FILE"
            grep -q 'export/android/debug_keystore' "$SETTINGS_FILE" || echo 'export/android/debug_keystore = "/root/debug.keystore"' >> "$SETTINGS_FILE"
            grep -q 'export/android/debug_keystore_user' "$SETTINGS_FILE" || echo 'export/android/debug_keystore_user = "androiddebugkey"' >> "$SETTINGS_FILE"
            grep -q 'export/android/debug_keystore_pass' "$SETTINGS_FILE" || echo 'export/android/debug_keystore_pass = "android"' >> "$SETTINGS_FILE"
          fi

      - name: Import project resources
        run: godot --headless --import || true

      - name: Export Android APK
        run: godot --headless --verbose --export-debug "Android" build/android/ut2004-mobile.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ut2004-mobile-apk
          path: build/android/ut2004-mobile.apk
